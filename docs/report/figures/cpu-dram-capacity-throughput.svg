  <text x="91" y="260.45" text-anchor="end" class="tick">14</text>
  <line x1="105" y1="214.09" x2="1145" y2="214.09" class="grid"/>
  <text x="91" y="219.09" text-anchor="end" class="tick">16</text>
  <line x1="105" y1="172.73" x2="1145" y2="172.73" class="grid"/>
  <text x="91" y="177.73" text-anchor="end" class="tick">18</text>
  <line x1="105" y1="131.36" x2="1145" y2="131.36" class="grid"/>
  <text x="91" y="136.36" text-anchor="end" class="tick">20</text>
  <line x1="105" y1="90.00" x2="1145" y2="90.00" class="grid"/>
