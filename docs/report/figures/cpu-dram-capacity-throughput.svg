  <text x="105.00" y="572" text-anchor="middle" class="tick">250</text>
  <line x1="278.33" y1="545" x2="278.33" y2="552" class="axis"/>
  <text x="278.33" y="572" text-anchor="middle" class="tick">375</text>
  <line x1="451.67" y1="545" x2="451.67" y2="552" class="axis"/>
  <text x="451.67" y="572" text-anchor="middle" class="tick">500</text>
  <line x1="625.00" y1="545" x2="625.00" y2="552" class="axis"/>
  <text x="625.00" y="572" text-anchor="middle" class="tick">625</text>
  <line x1="798.33" y1="545" x2="798.33" y2="552" class="axis"/>
