  <circle cx="105.00" cy="290.46" r="6" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
  <text x="105.00" y="314.46" text-anchor="middle" class="value" fill="#d97706">12.31</text>
  <circle cx="278.33" cy="290.46" r="6" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
  <text x="278.33" y="314.46" text-anchor="middle" class="value" fill="#d97706">12.31</text>
  <circle cx="451.67" cy="290.19" r="6" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
  <text x="451.67" y="314.19" text-anchor="middle" class="value" fill="#d97706">12.32</text>
  <circle cx="625.00" cy="290.44" r="6" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
  <text x="625.00" y="314.44" text-anchor="middle" class="value" fill="#d97706">12.31</text>
  <circle cx="798.33" cy="290.12" r="6" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
  <text x="798.33" y="314.12" text-anchor="middle" class="value" fill="#d97706">12.32</text>
  <circle cx="971.67" cy="290.40" r="6" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
  <text x="971.67" y="314.40" text-anchor="middle" class="value" fill="#d97706">12.31</text>
  <circle cx="1145.00" cy="290.29" r="6" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
  <text x="1145.00" y="314.29" text-anchor="middle" class="value" fill="#d97706">12.32</text>
  <line x1="835" y1="105" x2="873" y2="105" stroke="#087f8c" stroke-width="4"/>
  <text x="885" y="110" class="legend">Kimi K2</text>
  <line x1="835" y1="132" x2="873" y2="132" stroke="#d97706" stroke-width="4"/>
  <text x="885" y="137" class="legend">Kimi K3</text>
  <text x="105" y="632" class="note">Aggregate CPU range: Kimi K2 2–8 TB (8 PREFILL GPUs); Kimi K3 6–24 TB (24 PREFILL GPUs).</text>
  <text x="105" y="653" class="note">Each point is the highest tested session-injection rate that passed the operational stability and TTFT gates.</text>
