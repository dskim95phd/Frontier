  <circle cx="625.00" cy="180.28" r="6" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
  <text x="625.00" y="167.28" text-anchor="middle" class="value" fill="#087f8c">17.63</text>
  <circle cx="798.33" cy="119.29" r="6" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
  <text x="798.33" y="106.29" text-anchor="middle" class="value" fill="#087f8c">20.58</text>
  <circle cx="971.67" cy="118.45" r="6" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
  <text x="971.67" y="105.45" text-anchor="middle" class="value" fill="#087f8c">20.62</text>
  <circle cx="1145.00" cy="118.96" r="6" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
  <text x="1145.00" y="105.96" text-anchor="middle" class="value" fill="#087f8c">20.60</text>
