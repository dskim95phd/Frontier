<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">Sequence Length Distribution</title>
  <desc id="desc">Illustrative probability distribution of accumulated sequence length before a new input arrives, remaining relatively flat through one hundred thousand tokens and declining toward one million tokens.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#079a9a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#079a9a" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b1f4d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="22" y="22" width="956" height="706" rx="26" fill="#ffffff" stroke="#bfd0da" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="86" text-anchor="middle" fill="#075f68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Sequence Length Distribution</text>
  <text x="88" y="138" fill="#13264d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">P(x)</text>

  <g stroke="#dbe5ea" stroke-width="1.5">
    <line x1="110" y1="158" x2="920" y2="158"/>
    <line x1="110" y1="258" x2="920" y2="258"/>
    <line x1="110" y1="358" x2="920" y2="358"/>
    <line x1="110" y1="458" x2="920" y2="458"/>
    <line x1="380" y1="158" x2="380" y2="558"/>
    <line x1="650" y1="158" x2="650" y2="558"/>
  </g>

  <g stroke="#13264d" stroke-width="3" fill="none">
    <line x1="110" y1="145" x2="110" y2="558"/>
    <line x1="110" y1="558" x2="930" y2="558"/>
  </g>

  <path d="M110 231 C180 218 250 229 320 224 C398 219 472 232 548 225 C590 221 625 224 650 230 C680 238 704 259 728 293 C765 345 794 410 828 468 C858 517 888 545 920 555 L920 558 L110 558 Z" fill="url(#area)"/>
  <path d="M110 231 C180 218 250 229 320 224 C398 219 472 232 548 225 C590 221 625 224 650 230 C680 238 704 259 728 293 C765 345 794 410 828 468 C858 517 888 545 920 555" fill="none" stroke="#078b8b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#354766" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">
    <text x="110" y="596" text-anchor="middle">10³</text>
    <text x="380" y="596" text-anchor="middle">10⁴</text>
    <text x="650" y="596" text-anchor="middle">10⁵</text>
    <text x="920" y="596" text-anchor="middle">10⁶</text>
  </g>
  <text x="515" y="665" text-anchor="middle" fill="#13264d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Accumulated Sequence Length (tokens, log scale)</text>
</svg>
