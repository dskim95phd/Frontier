name: Bug report
description: Report incorrect simulation, crashes, or build failures
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: Frontier version or commit
      placeholder: frontier_sim --version and git rev-parse --short HEAD
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux GCC, Linux Clang, Windows MSVC, WSL, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command and the smallest shareable config/workload.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
